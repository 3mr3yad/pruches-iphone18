name: Build & Deploy

on:
  push:
    branches: [staging, main]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare image name
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "env=${{ github.ref_name == 'main' && 'production' || 'staging' }}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ vars.API_BASE }}
            NEXT_PUBLIC_MOYASAR_PUBLISHABLE_KEY=${{ vars.MOYASAR_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_MOYASAR_METHODS=${{ vars.MOYASAR_METHODS }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.env }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.env }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.env }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.env }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ vars.DEPLOY_PATH }} && docker compose pull && docker compose up -d && docker image prune -f"