server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # ملفات الـ JS والـ CSS: أسماءها بتتغير مع كل build، فالبراوزر يحفظها سنة
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /checkout → يدوّر على checkout.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}